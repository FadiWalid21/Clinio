<div class="auth-card">
  <div class="auth-header">
    <h2 class="auth-title">Welcome back</h2>
    <p class="auth-subtitle">Sign in to manage your wellness journey.</p>
  </div>

  <form (ngSubmit)="onSubmit()" class="auth-form">
    <div class="form-group">
      <label for="email" class="form-label">Email address</label>
      <input 
        type="email" 
        id="email" 
        name="email" 
        [(ngModel)]="credentials.email" 
        class="form-input" 
        placeholder="name@example.com" 
        required>
    </div>

    <div class="form-group">
      <div class="label-wrapper">
        <label for="password" class="form-label">Password</label>
        <a routerLink="/auth/forgot-password" class="form-link">Forgot password?</a>
      </div>
      <input 
        type="password" 
        id="password" 
        name="password" 
        [(ngModel)]="credentials.password" 
        class="form-input" 
        placeholder="••••••••" 
        required>
    </div>

    <button type="submit" class="btn btn-primary">Sign in</button>
  </form>

  <div class="auth-footer">
    <p>Don't have an account? <a routerLink="/auth/register" class="form-link-action">Create an account</a></p>
  </div>
</div>
